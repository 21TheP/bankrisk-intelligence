name = "bankrisk-intelligence"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static asset serving (Workers Static Assets)
[assets]
directory = "../"
binding = "ASSETS"

# Optional Cloudflare D1 for opted-in persistence
[[d1_databases]]
binding = "DB"
database_name = "bankrisk-d1"
database_id = "local-d1-binding"
migrations_dir = "migrations"
